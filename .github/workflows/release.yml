name: Release

# Publishes to npm when a version tag (v1.2.3) is pushed.
# Uses npm trusted publishing (OIDC): no npm token is stored anywhere.
# Provenance is attached automatically when the repository is public.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Tag matches package.json version
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json ($pkg)" >&2
            exit 1
          fi
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=moderate

  publish:
    needs: verify
    runs-on: ubuntu-latest
    # Once the repository is public, you can add `environment: npm` here with
    # required reviewers for a manual approval step (environments are not
    # available for private repositories on the free plan). If you do, set
    # the same environment name in the npm trusted publisher settings.
    permissions:
      contents: write   # create the GitHub release
      id-token: write   # npm trusted publishing and MCP Registry login (OIDC)
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Use an npm CLI that supports trusted publishing (>= 11.5.1)
        run: npm install -g npm@^11.5.1
      - run: npm ci
      - run: npm run build
      - name: Publish to npm (skipped if this version is already published)
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "::notice::$name@$version is already on npm; skipping publish, creating the GitHub release only."
          else
            npm publish --access public
          fi
      - name: Publish to the official MCP Registry (GitHub OIDC)
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          version="$(node -p "require('./package.json').version")"
          name="$(node -p "require('./package.json').mcpName")"
          # Wait until npm serves the version: the registry verifies the package.
          for i in $(seq 1 30); do
            npm view "mcp-authprobe@$version" version >/dev/null 2>&1 && break
            sleep 10
          done
          published="$(curl -fsS "https://registry.modelcontextprotocol.io/v0.1/servers?search=$name&version=$version" \
            | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{const j=JSON.parse(d);console.log((j.servers||[]).some(s=>s.server&&s.server.name===process.argv[1]&&s.server.version===process.argv[2]))})' "$name" "$version" || echo false)"
          if [ "$published" = "true" ]; then
            echo "::notice::$name $version is already in the MCP Registry; skipping."
            exit 0
          fi
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/mcp-publisher"
          tar xzf mcp-publisher.tar.gz -C "$RUNNER_TEMP/mcp-publisher"
          "$RUNNER_TEMP/mcp-publisher/mcp-publisher" login github-oidc
          "$RUNNER_TEMP/mcp-publisher/mcp-publisher" publish
      - name: Create the GitHub release from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists."
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag
